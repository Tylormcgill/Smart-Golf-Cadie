<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#82bff0"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Golf Caddie"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><title>Smart Golf Caddie</title><style>:root{--b:#82bff0;--bd:#4f9fe5;--p:#eef8ff;--g:#6e7d8b;--d:#3b4b5a;--l:#d9e3eb;--bg:#f3f7fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--d)}header{background:linear-gradient(135deg,#82bff0,#b6ddf8);color:#fff;text-align:center;padding:18px 16px}.brand{font-size:21px;font-weight:800}.brand span{margin-left:6px}header p{margin:4px 0 0;font-size:12px}main{max-width:560px;margin:auto;padding:16px 14px 35px}.mode{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}.mode a{text-decoration:none;text-align:center;padding:13px;border-radius:12px;background:#fff;border:1px solid var(--l);color:#477ba8;font-weight:800;font-size:14px}.mode a.active{background:var(--b);color:#fff;border-color:var(--b)}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 7px 22px #3c5a6e14}.main{text-align:center;padding:25px 20px}.eyebrow{font-size:11px;letter-spacing:.08em;font-weight:900;color:var(--g)}.giant{display:block;width:100%;border:0;outline:0;background:transparent;text-align:center;color:var(--bd);font-size:72px;font-weight:900;margin:7px 0 12px}.giant::placeholder{color:#cbd9e4}.btn{width:100%;border:0;border-radius:12px;background:var(--b);color:#fff;font-size:17px;font-weight:800;padding:14px}.rec{margin-top:20px;background:var(--p);border:1px solid #c8e4f8;border-radius:14px;padding:20px}.club{font-size:39px;font-weight:900;color:var(--bd);margin:5px 0}.carry{font-size:14px;color:var(--g)}.reason{margin-top:10px;color:#596b7a;font-size:13px;line-height:1.45}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.count{font-size:11px;color:var(--g)}.normal{width:100%;padding:13px;margin:14px 0 9px;border:1px solid #ccd9e3;border-radius:11px;font-size:18px;background:#f8fafc}.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #edf1f4;font-size:13px}.row:last-child,.shot:last-child{border:0}.avg{color:var(--bd);font-weight:900}.muted{font-size:12px;color:var(--g);line-height:1.45}.shot{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #edf1f4;font-size:12px}.shot small{color:var(--g)}@media(max-width:420px){.giant{font-size:62px}}</style></head><body><header><div class="brand">⛳ <span>Smart Golf Caddie</span></div><p>Your personal caddie</p></header><main><nav class="mode"><a class="active" href="./">Quick Caddie</a><a href="./course.html">📍 Play a Course</a></nav><section class="card main"><div class="eyebrow">YARDS TO THE HOLE</div><input id="hole" class="giant" type="number" inputmode="numeric" placeholder="227" oninput="recommend()"><button class="btn" onclick="recommend()">GET CLUB</button><div id="rec" class="rec"><div class="muted">Enter the yardage</div></div></section><section id="record" class="card" style="display:none"><div class="eyebrow">RECORD YOUR SHOT</div><h2 style="margin:7px 0">Hit the <span id="rc" style="color:var(--bd)"></span></h2><div class="muted">Then enter how far it actually carried.</div><input id="actual" class="normal" type="number" inputmode="numeric" placeholder="Actual carry"><button class="btn" onclick="saveShot()">SAVE SHOT</button></section><section class="card"><div class="title"><div><b>🧠 Learn My Game</b><div class="muted">Your real club distances</div></div><span id="count" class="count">0 shots</span></div><div id="clubs"></div></section><section class="card"><div class="title"><b>Recent Shots</b></div><div id="history" class="muted"></div></section></main><script>const base=[["Driver",220],["3 Wood",200],["5 Wood",185],["4 Iron",175],["5 Iron",165],["6 Iron",155],["7 Iron",145],["8 Iron",135],["9 Iron",120],["PW",105],["GW",90],["SW",75],["LW",60]];let data=JSON.parse(localStorage.getItem("simpleCaddieData")||"null")||Object.fromEntries(base.map(x=>[x[0],{start:x[1],shots:[]}])),shots=JSON.parse(localStorage.getItem("simpleCaddieShots")||"[]"),recommended=null;const avg=n=>data[n].shots.length?Math.round(data[n].shots.reduce((a,b)=>a+b,0)/data[n].shots.length):data[n].start;function recommend(){let y=+hole.value;if(!y){rec.innerHTML='<div class="muted">Enter the yardage</div>';record.style.display="none";recommended=null;return}let c=Object.keys(data).map(n=>({n,a:avg(n),s:data[n].shots.length})).sort((a,b)=>a.a-b.a),x=c.find(v=>v.a>=y)||c[c.length-1];recommended=x.n;rc.textContent=x.n;record.style.display="block";let note=x.a<y?"This is the longest club I’ve learned you can hit.":x.a-y<=10?"You’ll be near the top of this club’s range. Make a smooth swing.":"You have some room. Don't try to crush it.";rec.innerHTML='<div class="club">'+x.n+'</div><div class="carry">Learned carry: <b>'+x.a+' yards</b></div><div class="reason">'+note+'<br>'+(x.s?"Based on "+x.s+" logged shot"+(x.s==1?"":"s")+".":"Starting estimate — log shots to teach me your real distance.")+'</div>'}function saveShot(){let y=+actual.value;if(!recommended)return alert("Enter the yards to the hole first.");if(!y)return alert("Enter how far you actually hit it.");data[recommended].shots.push(y);shots.unshift({hole:+hole.value,club:recommended,actual:y});shots=shots.slice(0,50);localStorage.setItem("simpleCaddieData",JSON.stringify(data));localStorage.setItem("simpleCaddieShots",JSON.stringify(shots));actual.value="";record.style.display="none";hole.value="";rec.innerHTML='<div class="muted">Shot saved. Enter the next yardage.</div>';recommended=null;render()}function render(){clubs.innerHTML=Object.keys(data).map(n=>'<div class="row"><div><b>'+n+'</b><br><small>'+data[n].shots.length+' logged shot'+(data[n].shots.length==1?'':'s')+'</small></div><div class="avg">'+avg(n)+' yd</div></div>').join('');count.textContent=shots.length+' shot'+(shots.length==1?'':'s');history.innerHTML=shots.slice(0,8).map(s=>'<div class="shot"><span><b>'+s.hole+' yd</b> → '+s.club+'</span><span>'+s.actual+' yd <small>actual</small></span></div>').join('')||'No shots recorded yet.'}render()</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js')</script></body></html>
