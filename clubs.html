<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#82bff0"><title>Club Guide • Smart Golf Caddie</title><style>:root{--b:#82bff0;--bd:#4f9fe5;--p:#eef8ff;--g:#6e7d8b;--d:#3b4b5a;--l:#d9e3eb;--bg:#f3f7fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--d)}header{background:linear-gradient(135deg,#82bff0,#b6ddf8);color:#fff;text-align:center;padding:18px 16px}header h1{margin:0;font-size:23px}header p{margin:4px 0;font-size:12px}main{max-width:560px;margin:auto;padding:16px 14px 35px}.nav{display:block;text-align:center;text-decoration:none;color:#477ba8;font-weight:800;padding:11px}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 7px 22px #3c5a6e14}.clubName{font-size:30px;font-weight:900;color:var(--bd);margin:0}.subtitle{font-size:12px;color:var(--g);margin:3px 0 12px}.visual{height:210px;border-radius:15px;background:linear-gradient(#eaf6ff 0 57%,#7caa76 57%);position:relative;overflow:hidden;border:1px solid #c8e4f8}.ground{position:absolute;left:0;right:0;bottom:0;height:43%;background:repeating-linear-gradient(100deg,#79a875 0,#79a875 18px,#82af7e 18px,#82af7e 36px)}.feet{position:absolute;bottom:37px;left:50%;transform:translateX(-50%);width:150px;height:12px;border:3px solid #3b4b5a;border-radius:50%}.ball{position:absolute;bottom:42px;left:50%;width:12px;height:12px;margin-left:2px;border-radius:50%;background:#fff;border:2px solid #65717b}.person{position:absolute;bottom:47px;left:50%;transform:translateX(-50%);width:64px;height:125px}.head{position:absolute;top:0;left:25px;width:18px;height:18px;border-radius:50%;background:#e5b88f}.body{position:absolute;top:19px;left:22px;width:25px;height:60px;background:#82bff0;border-radius:12px 12px 8px 8px;transform:rotate(5deg)}.leg{position:absolute;top:72px;width:8px;height:53px;background:#3b4b5a;border-radius:6px}.leg.l{left:22px;transform:rotate(8deg)}.leg.r{left:43px;transform:rotate(-8deg)}.arm{position:absolute;top:28px;width:7px;height:55px;background:#e5b88f;border-radius:6px;transform-origin:top}.arm.l{left:18px;transform:rotate(48deg)}.arm.r{left:43px;transform:rotate(-48deg)}.club{position:absolute;top:65px;left:54px;width:4px;height:70px;background:#555;transform:rotate(-23deg);transform-origin:top}.caption{position:absolute;top:10px;left:12px;background:#fff;opacity:.9;border-radius:10px;padding:7px 9px;font-size:11px;font-weight:800;color:#477ba8}.tips{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.tip{background:#f8fafc;border:1px solid #e5edf3;border-radius:12px;padding:12px}.tip b{display:block;color:var(--bd);font-size:12px;margin-bottom:4px}.tip span{font-size:13px}.distance{text-align:center;background:var(--p);border:1px solid #c8e4f8;border-radius:13px;padding:12px;margin-top:12px}.distance b{font-size:23px;color:var(--bd)}.small{font-size:11px;color:var(--g)}</style></head><body><header><h1>🏌️ Club Guide</h1><p>Simple setup and ball position</p></header><main><a class="nav" href="./">← Back to Quick Caddie</a><div id="clubs"></div></main><script>const clubs=[['Driver','Ball position: inside your lead heel','Stance: widest of the set','Tee high; sweep the ball'],['3 Wood','Ball position: slightly forward of center','Stance: shoulder-width','Sweep it; avoid trying to lift it'],['5 Wood','Ball position: slightly forward of center','Stance: shoulder-width','Smooth sweep through the ball'],['4 Iron','Ball position: just forward of center','Stance: shoulder-width','Small forward press; hit ball first'],['5 Iron','Ball position: just forward of center','Stance: shoulder-width','Ball first, then turf'],['6 Iron','Ball position: slightly forward of center','Stance: shoulder-width','Balanced, controlled swing'],['7 Iron','Ball position: slightly forward of center','Stance: shoulder-width','Classic iron setup; ball first'],['8 Iron','Ball position: near center, slightly forward','Stance: just under shoulder-width','Stay balanced and strike down'],['9 Iron','Ball position: near center','Stance: just under shoulder-width','Smooth three-quarter feel'],['PW','Ball position: center to slightly forward','Stance: narrow','Controlled swing; crisp contact'],['GW','Ball position: center','Stance: narrow','Controlled, centered strike'],['SW','Ball position: center','Stance: narrow','Soft arms; use the club bounce'],['LW','Ball position: center to slightly forward','Stance: narrow','Smooth tempo; let the loft work']];const base={Driver:220,'3 Wood':200,'5 Wood':185,'4 Iron':175,'5 Iron':165,'6 Iron':155,'7 Iron':145,'8 Iron':135,'9 Iron':120,PW:105,GW:90,SW:75,LW:60};let data=JSON.parse(localStorage.getItem('simpleCaddieData')||'null');const avg=n=>data?.[n]?.shots?.length?Math.round(data[n].shots.reduce((a,b)=>a+b,0)/data[n].shots.length):base[n];document.getElementById('clubs').innerHTML=clubs.map(c=>`<section class="card"><h2 class="clubName">${c[0]}</h2><div class="subtitle">Your Smart Caddie setup guide</div><div class="visual"><div class="caption">BALL POSITION + STANCE</div><div class="ground"></div><div class="feet"></div><div class="ball"></div><div class="person"><div class="head"></div><div class="body"></div><div class="leg l"></div><div class="leg r"></div><div class="arm l"></div><div class="arm r"></div><div class="club"></div></div></div><div class="tips"><div class="tip"><b>📍 BALL</b><span>${c[1]}</span></div><div class="tip"><b>🧍 STANCE</b><span>${c[2]}</span></div></div><div class="tip" style="margin-top:9px"><b>🏌️ FOCUS</b><span>${c[3]}</span></div><div class="distance"><div class="small">YOUR LEARNED DISTANCE</div><b>${avg(c[0])} yd</b></div></section>`).join('')</script></body></html>
