<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b9ddf4"><title>Club Guide • Smart Golf Caddie</title><style>:root{--blue:#b9ddf4;--navy:#102b55;--line:#cbdceb;--bg:#f5f8fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--navy)}header{padding:20px 16px 14px;text-align:center;background:linear-gradient(#dff0fb,#f5f8fb);border-bottom:1px solid var(--line)}header a{position:absolute;left:18px;top:23px;color:var(--navy);text-decoration:none;font-size:17px;font-weight:700}h1{margin:0;font-size:28px;letter-spacing:.5px}header p{margin:4px 0 0;font-size:15px}main{max-width:1100px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}.name{text-align:center;font-size:20px;font-weight:900;padding:8px 4px;background:#edf4fa}.scene{height:205px;position:relative;overflow:hidden;background:radial-gradient(circle at 30% 30%,#78b33f 0,#5f9d31 45%,#4f8c2c 100%)}.grass{position:absolute;inset:0;opacity:.22;background:repeating-linear-gradient(25deg,transparent 0 5px,#d4efad 6px 7px)}.shoe{position:absolute;bottom:-24px;width:62px;height:120px;background:linear-gradient(100deg,#fff,#e7ebef);border:2px solid #c7ccd2;border-radius:42% 48% 28% 28%;box-shadow:inset -8px 0 0 #d9dde1,0 3px 5px #244d1b66}.shoe:after{content:"";position:absolute;top:30px;left:12px;width:35px;height:3px;background:#b9c0c8;box-shadow:0 10px 0 #b9c0c8,0 20px 0 #b9c0c8;transform:rotate(-8deg)}.left{left:17%}.right{right:17%}.ball{position:absolute;top:20px;left:var(--ball,50%);transform:translateX(-50%);width:27px;height:27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e7e7e7 70%,#bfc5ca);box-shadow:0 2px 4px #183e1c66}.line{position:absolute;top:48px;bottom:45px;left:var(--ball,50%);width:3px;background:#172a18;transform:translateX(-50%)}.arrow{position:absolute;top:calc(100% - 59px);left:var(--ball,50%);width:12px;height:12px;border-right:3px solid #172a18;border-bottom:3px solid #172a18;transform:translateX(-50%) rotate(45deg)}.feet-label{position:absolute;bottom:9px;left:0;right:0;text-align:center;color:#fff;font-weight:800;font-size:11px;text-shadow:0 1px 3px #173b12}.info{display:flex;justify-content:space-between;gap:8px;padding:10px 12px 12px}.info b{display:block;font-size:11px;letter-spacing:.4px}.info span{font-size:13px;line-height:1.2}.avg{text-align:right}.avg span{font-size:21px;font-weight:900}.note{padding:0 12px 12px;font-size:11px;color:#53677a}.bottom{margin-top:16px;text-align:center;font-size:12px;color:#65788a}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:9px}.scene{height:155px}.shoe{width:45px;height:92px}.left{left:12%}.right{right:12%}.name{font-size:16px}.info{padding:8px}.info span{font-size:11px}.avg span{font-size:17px}.note{font-size:10px}}@media(max-width:400px){.grid{grid-template-columns:1fr}.scene{height:205px}}</style></head><body><header><a href="./">‹ Back</a><h1>CLUB GUIDE</h1><p>Ball position &amp; stance</p></header><main><div class="grid" id="grid"></div><div class="bottom">Move the ball position—not your basic stance—to match the club.</div></main><script>const clubs=[['Driver','Inside lead heel','220 yd',54],['3 Wood','Just inside lead heel','200 yd',52],['5 Wood','Slightly forward of center','185 yd',50],['4 Iron','Slightly forward of center','175 yd',48],['5 Iron','Slightly forward of center','165 yd',47],['6 Iron','Slightly forward of center','155 yd',46],['7 Iron','Near center','145 yd',50],['8 Iron','Near center','135 yd',49],['9 Iron','Near center','120 yd',48],['PW','Center to slightly back','105 yd',47],['GW','Center to slightly back','90 yd',46],['SW','Slightly back of center','75 yd',45],['LW','Slightly back of center','60 yd',44]];const learned=JSON.parse(localStorage.getItem('simpleCaddieData')||'{}');function avg(name,fallback){const s=learned?.[name]?.shots;return s&&s.length?Math.round(s.reduce((a,b)=>a+b,0)/s.length)+' yd':fallback+' yd'}document.getElementById('grid').innerHTML=clubs.map(c=>`<section class="card"><div class="name">${c[0]}</div><div class="scene" style="--ball:${c[3]}%"><div class="grass"></div><div class="ball"></div><div class="line"></div><div class="arrow"></div><div class="shoe left"></div><div class="shoe right"></div><div class="feet-label">TOP-DOWN STANCE</div></div><div class="info"><div><b>BALL POSITION</b><span>${c[1]}</span></div><div class="avg"><b>YOUR AVG</b><span>${avg(c[0],c[2].replace(' yd',''))}</span></div></div><div class="note">Feet stay athletic and comfortable; ball moves with the club.</div></section>`).join('')</script></body></html>
