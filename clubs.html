<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#dff1ff"><title>Club Guide • Smart Golf Caddie</title><style>:root{--blue:#0b3154;--accent:#1764c0;--light:#eaf5ff;--line:#cbdceb;--text:#122b46;--muted:#607286}*{box-sizing:border-box}body{margin:0;background:#f7fafc;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{background:#e8f4ff;border-bottom:1px solid #d3e4f2;text-align:center;padding:18px 14px 14px;position:relative}header a{position:absolute;left:18px;top:22px;color:var(--blue);font-size:16px;font-weight:700;text-decoration:none}header h1{margin:0;font-size:27px;letter-spacing:.5px;color:var(--blue)}header p{margin:4px 0 0;font-size:15px;color:var(--blue)}main{max-width:1100px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:0 2px 6px #17395710}.title{background:#e7f2fc;text-align:center;font-size:19px;font-weight:900;color:var(--blue);padding:8px 4px}.stance{height:215px;position:relative;overflow:hidden;background:repeating-linear-gradient(25deg,#78aa32 0,#78aa32 9px,#83b43a 9px,#83b43a 18px)}.stance:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,#a4cf58 0,#84b23c 45%,#679326 100%);opacity:.72}.shoe{position:absolute;bottom:-10px;width:58px;height:112px;background:linear-gradient(100deg,#fff,#d9dfe5);border-radius:28px 28px 18px 18px;box-shadow:0 2px 4px #314b271f}.shoe.left{left:24%;transform:rotate(7deg)}.shoe.right{right:24%;transform:rotate(-7deg)}.shoe:after{content:"";position:absolute;left:12px;right:12px;top:24px;height:2px;background:#c1c7cd;box-shadow:0 10px #c1c7cd,0 20px #c1c7cd}.ball{position:absolute;top:var(--ball,25px);left:50%;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e8edf0);border:1px solid #aab5bd;box-shadow:0 2px 3px #2c421f55;z-index:2}.arrow{position:absolute;top:49px;left:50%;width:3px;height:105px;background:#182a19;transform:translateX(-50%);z-index:1}.arrow:after{content:"";position:absolute;bottom:-1px;left:-6px;width:12px;height:12px;border-right:3px solid #182a19;border-bottom:3px solid #182a19;transform:rotate(45deg)}.info{padding:10px 12px 12px;display:flex;justify-content:space-between;gap:10px}.label{font-size:11px;font-weight:900;color:var(--blue);letter-spacing:.4px}.pos{font-size:13px;margin-top:3px;line-height:1.2}.avg{text-align:right;white-space:nowrap}.avg b{display:block;color:var(--accent);font-size:21px;margin-top:2px}.avg small{font-size:11px;font-weight:900;color:var(--accent)}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}main{padding:9px}.stance{height:165px}.shoe{width:45px;height:88px}.shoe.left{left:17%}.shoe.right{right:17%}.arrow{height:82px;top:45px}.card .title{font-size:16px;padding:7px 3px}.info{padding:9px 8px;display:block}.avg{text-align:left;margin-top:8px}.avg b{font-size:18px}.pos{font-size:12px}header h1{font-size:23px}header p{font-size:13px}}@media(max-width:360px){.grid{grid-template-columns:1fr}.stance{height:190px}}</style></head><body><header><a href="./">‹ Back</a><h1>CLUB GUIDE</h1><p>Proper ball position by club type</p></header><main><div class="grid" id="clubs"></div></main><script>const clubs=[['DRIVER','Inside left heel','248'],['3 WOOD','Just inside left foot','228'],['5 WOOD','Center of stance','210'],['4 IRON','Slightly forward of center','185'],['5 IRON','Center of stance','170'],['6 IRON','Center of stance','155'],['7 IRON','Center of stance','145'],['8 IRON','Slightly back of center','135'],['9 IRON','Slightly back of center','125'],['PW','Back of center','110'],['GW','Back of center','95'],['SW','Back of center','80'],['LW','Back of center','65']];let data=JSON.parse(localStorage.getItem('simpleCaddieData')||'null');function learned(name,fallback){let key=name.replace(' WOOD',' Wood').replace(' IRON',' Iron').replace('DRIVER','Driver');let s=data?.[key]?.shots;if(s?.length)return Math.round(s.reduce((a,b)=>a+b,0)/s.length);return fallback}const pos={'DRIVER':'inside','3 WOOD':'inside','5 WOOD':'center','4 IRON':'forward','5 IRON':'center','6 IRON':'center','7 IRON':'center','8 IRON':'back','9 IRON':'back','PW':'back','GW':'back','SW':'back','LW':'back'};const ballTop={inside:'24px',forward:'58px',center:'82px',back:'105px'};document.getElementById('clubs').innerHTML=clubs.map(c=>{let p=pos[c[0]],yd=learned(c[0],c[2]);return `<article class="card"><div class="title">${c[0]}</div><div class="stance" style="--ball:${ballTop[p]}"><div class="ball"></div><div class="arrow"></div><div class="shoe left"></div><div class="shoe right"></div></div><div class="info"><div><div class="label">BALL POSITION</div><div class="pos">${c[1]}</div></div><div class="avg"><small>YOUR AVG</small><b>${yd} YDS</b></div></div></article>`}).join('')</script></body></html>
