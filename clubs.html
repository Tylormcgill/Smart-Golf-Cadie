<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#82bff0"><title>Club Guide • Smart Golf Caddie</title><style>:root{--blue:#123b61;--baby:#82bff0;--gray:#647484;--bg:#f4f7fa;--line:#d5dee7}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#172534}header{background:linear-gradient(135deg,#82bff0,#b8def5);color:#fff;text-align:center;padding:16px 12px 14px}header h1{margin:0;font-size:24px;font-weight:900}header p{margin:3px 0 0;font-size:13px}.back{display:block;max-width:900px;margin:auto;padding:13px 14px 3px;color:#477ba8;text-decoration:none;font-weight:800}main{max-width:900px;margin:auto;padding:10px 12px 35px}.intro{text-align:center;color:var(--gray);font-size:13px;margin:4px 0 15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid #9fb0bf;border-radius:14px;overflow:hidden;box-shadow:0 4px 12px #38546b18}.club{background:var(--blue);color:#fff;text-align:center;font-weight:900;font-size:17px;padding:9px 4px}.stance{height:178px;position:relative;overflow:hidden;background:linear-gradient(90deg,#77a94f,#92ba5d 48%,#79aa50);background-image:radial-gradient(#ffffff16 1px,transparent 1px),linear-gradient(90deg,#78a951,#91b85d 48%,#78a951);background-size:9px 9px,100% 100%}.line{position:absolute;top:18px;bottom:32px;width:2px;background:#202b25;left:50%;transform:translateX(-50%)}.arrow{position:absolute;top:78px;left:50%;width:2px;height:67px;background:#202b25;transform:translateX(-50%)}.arrow:after{content:"";position:absolute;bottom:-1px;left:-5px;width:9px;height:9px;border-right:2px solid #202b25;border-bottom:2px solid #202b25;transform:rotate(45deg)}.ball{position:absolute;top:11px;left:calc(50% + var(--ball));width:19px;height:19px;border-radius:50%;background:#fff;border:1px solid #5e6870;box-shadow:0 2px 3px #0004;transform:translateX(-50%)}.foot{position:absolute;bottom:2px;width:39px;height:103px;background:linear-gradient(105deg,#fff,#dfe4e8);border-radius:50% 50% 38% 38%;box-shadow:0 1px 2px #0004}.left{left:calc(50% - var(--stance));transform:rotate(4deg)}.right{left:calc(50% + var(--stance));transform:rotate(-4deg)}.label{padding:10px 8px 11px;text-align:center;min-height:64px}.label b{display:block;font-size:12px;color:#172534;letter-spacing:.02em}.label span{display:block;font-size:12px;color:#4f5e6c;margin-top:4px}.distance{background:#eef8ff;border-top:1px solid #d3e7f5;text-align:center;padding:7px;font-size:11px;color:#6a7885}.distance strong{display:block;font-size:15px;color:#477ba8}.note{text-align:center;font-size:11px;color:#74818c;margin:15px 5px 0}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.club{font-size:15px}.stance{height:155px}.foot{height:87px;width:33px}.ball{width:17px;height:17px}.label{min-height:70px}.label b{font-size:11px}.label span{font-size:11px}}@media(max-width:390px){.grid{grid-template-columns:1fr 1fr}.stance{height:145px}}</style></head><body><header><h1>🏌️ CLUB GUIDE</h1><p>Proper ball position by club type</p></header><a class="back" href="./">← Back to Quick Caddie</a><main><p class="intro">One simple picture for each club. Ball position moves as the club changes.</p><div id="clubs" class="grid"></div><p class="note">Ball-position guidance is a simple setup reference. Your swing and comfort may require small adjustments.</p></main><script>const clubs=[['DRIVER', 'Inside left heel','-55px',48,220],['3 WOOD','Just inside left foot','-43px',48,200],['5 WOOD','Center of stance','0px',48,185],['4 IRON','Slightly forward of center','-18px',45,175],['5 IRON','Center of stance','0px',45,165],['6 IRON','Center of stance','0px',45,155],['7 IRON','Center of stance','0px',43,145],['8 IRON','Slightly back of center','18px',43,135],['9 IRON','Slightly back of center','18px',43,120],['PW','Back of center','25px',40,105],['GW','Back of center','25px',40,90],['SW','Back of center','25px',40,75],['LW','Back of center','25px',40,60]];let data=JSON.parse(localStorage.getItem('simpleCaddieData')||'null');function avg(n,base){const x=data?.[n]?.shots||[];return x.length?Math.round(x.reduce((a,b)=>a+b,0)/x.length):base}document.getElementById('clubs').innerHTML=clubs.map(c=>`<article class="card"><div class="club">${c[0]}</div><div class="stance" style="--ball:${c[2]};--stance:${c[3]}px"><div class="line"></div><div class="arrow"></div><div class="ball"></div><div class="foot left"></div><div class="foot right"></div></div><div class="label"><b>BALL POSITION</b><span>${c[1]}</span></div><div class="distance">YOUR LEARNED DISTANCE<strong>${avg(c[0].replace(' ',' '),c[4])} YDS</strong></div></article>`).join('')</script></body></html>
